[package]
name = "mihoterm"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny, fast, keyboard-first TUI for Mihomo on Linux."
license = "MIT"
repository = "https://github.com/wxndong/mihoterm"
readme = "README.md"
keywords = ["mihomo", "tui", "proxy", "linux", "terminal"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[dependencies]
clap = { version = "4.6.4", features = ["derive", "env"] }
crossterm = { version = "0.29.0", default-features = false, features = ["event-stream"] }
futures-util = "0.3.33"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "net", "test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"
