name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-equivalent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Run local-equivalent checks
        run: ./scripts/ci-local.sh
