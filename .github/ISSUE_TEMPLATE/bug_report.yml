name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove controller secrets, subscription URLs, proxy names, and personal
        paths before submitting.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal, sanitized steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MihoTerm version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: mihomo
    attributes:
      label: Mihomo version
      placeholder: v1.x.y
    validations:
      required: true
